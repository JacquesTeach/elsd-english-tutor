<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3182ce">
    <title>ELSD English Language Tutor</title>
    <style>
        :root {
            color-scheme: light;
            --primary-blue: #3182ce;
            --primary-dark: #2c5282;
            --light-blue: #ebf8ff;
            --background-color: #f7fafc;
            --chat-bg: #ffffff;
            --text-dark: #2d3748;
            --text-light: #718096;
            --bot-bubble: #e2e8f0;
            --user-bubble: #3182ce;
            --online-green: #48bb78;
            --border: #cbd5e0;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--background-color);
            color: var(--text-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        button, input { font: inherit; }

        .chat-container {
            width: min(100%, 520px);
            height: min(850px, calc(100vh - 40px));
            min-height: 420px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--chat-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .1);
        }

        .chat-header {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            color: white;
            background: var(--primary-blue);
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1);
        }

        .avatar {
            width: 42px;
            height: 42px;
            margin-right: 12px;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            border-radius: 50%;
            background: white;
            font-size: 21px;
        }

        .bot-name { font-size: 1.05rem; font-weight: 700; }
        .status { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: .8rem; opacity: .95; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--online-green); }

        .chat-box {
            flex: 1;
            min-height: 0;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .message-row { display: flex; width: 100%; }
        .message-row.bot { justify-content: flex-start; }
        .message-row.user { justify-content: flex-end; }
        .message-bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: .95rem;
            line-height: 1.5;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }
        .bot .message-bubble { border-bottom-left-radius: 4px; background: var(--bot-bubble); }
        .user .message-bubble { border-bottom-right-radius: 4px; color: white; background: var(--user-bubble); }

        .quick-start-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px 15px;
            border-top: 1px solid #e2e8f0;
            background: var(--light-blue);
        }

        .quick-btn {
            padding: 7px 12px;
            border: 1px solid var(--primary-blue);
            border-radius: 20px;
            color: var(--primary-blue);
            background: white;
            cursor: pointer;
            transition: background-color .2s, color .2s;
        }
        .quick-btn:hover, .quick-btn:focus-visible { color: white; background: var(--primary-blue); }
        button:focus-visible, input:focus-visible { outline: 3px solid #90cdf4; outline-offset: 2px; }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 14px 15px;
            border-top: 1px solid #e2e8f0;
            background: white;
        }
        .chat-input {
            min-width: 0;
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 24px;
            color: var(--text-dark);
            font-size: .95rem;
        }
        .chat-input:focus { border-color: var(--primary-blue); outline: 2px solid #bee3f8; }
        .send-btn {
            width: 46px;
            height: 46px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 50%;
            color: white;
            background: var(--primary-blue);
            cursor: pointer;
        }
        .send-btn:hover:not(:disabled) { background: var(--primary-dark); }
        .send-btn:disabled { opacity: .6; cursor: wait; }
        .send-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .typing-indicator { padding: 4px 10px; color: var(--text-light); font-size: .85rem; font-style: italic; animation: pulse 1.3s infinite; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
        @keyframes pulse { 50% { opacity: .45; } }

        @media (max-width: 520px) {
            body { padding: 0; }
            .chat-container { width: 100%; height: 100vh; height: 100dvh; min-height: 0; border-radius: 0; }
            .chat-box { padding: 16px; }
            .message-bubble { max-width: 90%; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; } }
    </style>
</head>
<body>
    <main class="chat-container" aria-label="ELSD English tutor chat">
        <header class="chat-header">
            <div class="avatar" aria-hidden="true">🎓</div>
            <div>
                <div class="bot-name">ELSD English Language Tutor</div>
                <div class="status"><span class="status-dot" aria-hidden="true"></span><span>Ready to practice</span></div>
            </div>
        </header>

        <section class="chat-box" id="chatBox" aria-label="Conversation" aria-live="polite" aria-relevant="additions"></section>

        <nav class="quick-start-container" aria-label="Practice activities">
            <button class="quick-btn" type="button" data-prompt="Grammar help">Grammar Help</button>
            <button class="quick-btn" type="button" data-prompt="Learn vocabulary">Learn Vocabulary</button>
            <button class="quick-btn" type="button" data-prompt="Reading practice">Reading Practice</button>
            <button class="quick-btn" type="button" data-prompt="Listening exercise">Listening Exercise</button>
        </nav>

        <form class="input-area" id="chatForm">
            <label class="sr-only" for="userInput">Your message</label>
            <input type="text" id="userInput" class="chat-input" placeholder="Type your message here..." autocomplete="off" maxlength="500" required>
            <button id="sendBtn" class="send-btn" type="submit" aria-label="Send message">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </form>
    </main>

    <script>
        'use strict';

        const chatBox = document.getElementById('chatBox');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        let currentActivity = null;

        const vocabulary = {
            curious: ['wanting to learn or know more about something', 'I was curious about how the story would end.'],
            generous: ['willing to give or share more than is expected', 'It was generous of Maya to share her lunch.'],
            improve: ['to become or make something better', 'Reading every day can improve your vocabulary.'],
            reliable: ['able to be trusted or depended on', 'The reliable bus usually arrives on time.'],
            exhausted: ['very tired', 'After the long walk, we were exhausted.'],
            ancient: ['very old; from a long time ago', 'They visited an ancient castle.'],
            confident: ['feeling sure about your abilities or ideas', 'Practicing helped him feel confident speaking English.'],
            opportunity: ['a good chance to do or achieve something', 'The class gave me an opportunity to practice.']
        };

        function addMessage(sender, text) {
            const row = document.createElement('div');
            row.className = `message-row ${sender}`;
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;
            row.appendChild(bubble);
            chatBox.appendChild(row);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showTyping() {
            const row = document.createElement('div');
            row.className = 'message-row bot';
            row.id = 'typingIndicator';
            const label = document.createElement('div');
            label.className = 'typing-indicator';
            label.textContent = 'ELSD is thinking…';
            row.appendChild(label);
            chatBox.appendChild(row);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function answerActivity(message) {
            const activity = currentActivity;
            currentActivity = null;
            const answer = message.toLowerCase().replace(/[^a-z\s']/g, '').trim();
            const accepted = activity.answers.some(item => answer.includes(item));
            if (accepted) {
                return `That's right! ${activity.explanation}\n\nWould you like another exercise? Choose a practice button or ask me a question.`;
            }
            return `Good try! The answer is “${activity.displayAnswer}.” ${activity.explanation}\n\nWould you like another exercise? Choose a practice button or ask me a question.`;
        }

        function startGrammar() {
            currentActivity = {
                answers: ['went'], displayAnswer: 'went',
                explanation: 'Use the past-tense verb “went” for an action that happened yesterday. The correct sentence is: “Yesterday, I went to the library.”'
            };
            return 'Grammar practice: Choose the correct word.\n“Yesterday, I ___ to the library.”\n\nReply with the missing word.';
        }

        function startReading() {
            currentActivity = {
                answers: ['seed', 'a seed'], displayAnswer: 'a seed',
                explanation: 'The passage says Sam planted a seed in a small pot, then watered it each morning.'
            };
            return 'Reading practice:\n\nSam planted a seed in a small pot. Each morning, Sam watered it and placed it by the sunny window. After two weeks, a tiny green shoot appeared. Sam was excited to watch it grow.\n\nQuestion: What did Sam plant?';
        }

        function startListening() {
            const passage = 'On Saturday morning, Lina went to the market with her brother. They bought apples and bread, then walked home before the rain started.';
            currentActivity = {
                answers: ['apples and bread', 'bread and apples', 'apples', 'bread'],
                displayAnswer: 'apples and bread',
                explanation: 'Lina and her brother bought apples and bread at the market.'
            };
            const prompt = 'Listening practice: I will read a short passage. Listen, then answer: What did Lina and her brother buy?';
            if ('speechSynthesis' in window && 'SpeechSynthesisUtterance' in window) {
                const utterance = new SpeechSynthesisUtterance(passage);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
                return `${prompt}\n\nIf you cannot hear the audio, you can still answer: ${passage}`;
            }
            return `${prompt}\n\nAudio playback is not available in this browser. Read the passage instead: ${passage}`;
        }

        function getTutorResponse(message) {
            const text = message.trim();
            const lower = text.toLowerCase();

            if (currentActivity) return answerActivity(text);
            if (/^(hi|hello|hey|good morning|good afternoon)\b/.test(lower)) {
                return 'Hello! What would you like to practice today: grammar, vocabulary, reading, or listening? You can also type a sentence and I’ll offer a learning tip.';
            }
            if (/grammar|verb|tense|punctuation|sentence|pronoun|adjective|preposition/.test(lower)) return startGrammar();
            if (/reading/.test(lower)) return startReading();
            if (/listening|listen/.test(lower)) return startListening();
            if (/vocab|word|definition|meaning/.test(lower)) {
                const match = lower.match(/(?:meaning of|define|definition of|what does|vocabulary)\s+([a-z'-]+)/);
                if (match && vocabulary[match[1]]) {
                    const [meaning, example] = vocabulary[match[1]];
                    return `“${match[1]}” means ${meaning}.\nExample: ${example}\n\nTry using “${match[1]}” in your own sentence.`;
                }
                if (match) return `I don’t have a saved definition for “${match[1]}” yet. Try one of these words: curious, generous, improve, reliable, exhausted, ancient, confident, or opportunity. Or type “vocabulary quiz” to practice.`;
                currentActivity = {
                    answers: ['curious'], displayAnswer: 'curious',
                    explanation: '“Curious” means wanting to learn or know more. For example: “The curious student asked a question.”'
                };
                return 'Vocabulary quiz: Which word means “wanting to learn or know more”?\n\nReply with the word.';
            }
            if (/^(thanks|thank you)\b/.test(lower)) return 'You’re welcome! Keep practicing a little each day. What would you like to work on next?';
            if (/help|practice|exercise|quiz/.test(lower)) return 'I can give you a grammar question, a vocabulary quiz, a short reading comprehension activity, or a listening exercise. Choose one of the buttons below, or type the activity you want.';
            if (/\b(is|are|was|were|has|have|he|she|they|i)\b/.test(lower) && text.split(/\s+/).length >= 3) {
                return 'Nice practice! A useful check is to make the subject and verb agree (for example, “She is” but “They are”). Would you like a grammar exercise?';
            }
            return 'Thanks for your message! I’m a simple English practice tutor with built-in grammar, vocabulary, reading, and listening activities. Ask for a word’s meaning (for example, “What does curious mean?”), or choose a practice button below.';
        }

        function submitMessage(message) {
            const text = message.trim();
            if (!text || sendBtn.disabled) return;
            addMessage('user', text);
            userInput.value = '';
            sendBtn.disabled = true;
            userInput.disabled = true;
            showTyping();

            window.setTimeout(() => {
                const typing = document.getElementById('typingIndicator');
                if (typing) typing.remove();
                addMessage('bot', getTutorResponse(text));
                sendBtn.disabled = false;
                userInput.disabled = false;
                userInput.focus();
            }, 350);
        }

        chatForm.addEventListener('submit', event => {
            event.preventDefault();
            submitMessage(userInput.value);
        });

        document.querySelectorAll('.quick-btn').forEach(button => {
            button.addEventListener('click', () => submitMessage(button.dataset.prompt));
        });

        addMessage('bot', 'Hello! I’m ELSD, your English practice tutor. I can help with grammar, vocabulary, reading, and listening. Choose an activity below or type a question to get started.');
        userInput.focus();
    </script>
</body>
</html>
