<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ELSD English Tutor</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#eef4fb;
    font-family:Segoe UI, Arial, sans-serif;
}

.container{
    max-width:1100px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.12);
}

h1{
    text-align:center;
    color:#0b4f99;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:bold;
}

select,
textarea,
button{
    width:100%;
    padding:10px;
    font-size:16px;
}

textarea{
    min-height:140px;
    resize:vertical;
}

button{
    border:none;
    background:#0b66d1;
    color:white;
    cursor:pointer;
    border-radius:6px;
}

button:hover{
    background:#0957af;
}

.button-row{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.button-row button{
    flex:1;
}

#response{
    margin-top:20px;
    background:#f6faff;
    border:1px solid #d4e0f5;
    border-radius:8px;
    padding:15px;
    min-height:200px;
    white-space:pre-wrap;
}

.footer{
    margin-top:20px;
    text-align:center;
    color:#666;
    font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<h1>ELSD English Tutor</h1>

<label>CEFR Level</label>

<select id="level">
<option>A1</option>
<option>A2</option>
<option>B1</option>
<option>B2</option>
<option>C1</option>
</select>

<label>Activity Type</label>

<select id="mode" onchange="updateTopics()">
<option value="general">General ESL Question</option>
<option value="vocabulary">Oxford Vocabulary Practice</option>
<option value="grammar">Grammar Practice</option>
<option value="reading">Reading Practice</option>
<option value="listening">Listening Practice</option>
</select>

<label>Topic</label>

<select id="topic"></select>

<label>Student Request</label>

<textarea
id="question"
placeholder="Type your question or request here..."></textarea>

<div class="button-row">

<button onclick="askTutor()">
Generate
</button>

<button onclick="copyResponse()">
Copy
</button>

<button onclick="clearAll()">
Reset
</button>

</div>

<div id="response">
Ready.
</div>

<div class="footer">
ELSD English Tutor
</div>

</div>

<script>

const API_URL =
"https://jacquesteach.github.io";

const topicData = {

general: [
"General English",
"Conversation",
"Pronunciation",
"Vocabulary Building"
],

vocabulary: [
"Oxford A1",
"Oxford A2",
"Oxford B1",
"Oxford B2",
"Oxford C1",
"Academic Vocabulary",
"Business Vocabulary",
"Travel Vocabulary"
],

grammar: [
"Present Simple",
"Present Continuous",
"Past Simple",
"Past Continuous",
"Present Perfect",
"Future Forms",
"Modals",
"Articles",
"Prepositions",
"Countable and Uncountable Nouns",
"Comparatives",
"Superlatives",
"Conditionals",
"Passive Voice",
"Reported Speech"
],

reading: [
"Culture",
"History",
"Science"
],

listening: [
"Dinosaurs",
"Famous Scholars",
"Businesspeople",
"Scientists"
]

};

function updateTopics() {

    const mode =
        document.getElementById("mode").value;

    const topicSelect =
        document.getElementById("topic");

    topicSelect.innerHTML = "";

    topicData[mode].forEach(topic => {

        const option =
            document.createElement("option");

        option.value = topic;
        option.textContent = topic;

        topicSelect.appendChild(option);

    });

    updatePlaceholder();

}

function updatePlaceholder() {

    const mode =
        document.getElementById("mode").value;

    const questionBox =
        document.getElementById("question");

    if(mode === "grammar"){

        questionBox.placeholder =
        "Ask for explanations or extra grammar practice...";

    }

    else if(mode === "reading"){

        questionBox.placeholder =
        "Request a reading passage or comprehension activity...";

    }

    else if(mode === "listening"){

        questionBox.placeholder =
        "Request a listening exercise or listening script...";

    }

    else if(mode === "vocabulary"){

        questionBox.placeholder =
        "Enter a word or request vocabulary practice...";

    }

    else{

        questionBox.placeholder =
        "Type any English question here...";

    }

}

async function askTutor(){

    const level =
        document.getElementById("level").value;

    const mode =
        document.getElementById("mode").value;

    const topic =
        document.getElementById("topic").value;

    const question =
        document.getElementById("question").value;

    let prompt = "";

    if(mode === "vocabulary"){

        prompt = `
Create a CEFR ${level} vocabulary lesson.

Topic:
${topic}

Student Request:
${question}

Include:
- Definition
- Part of Speech
- IPA
- 2 Example Sentences
- Common Collocations
- Synonyms
- Practice Activity
- Answer Key
`;

    }

    else if(mode === "grammar"){

        prompt = `
Create a CEFR ${level} grammar lesson.

Grammar Topic:
${topic}

Student Request:
${question}

Include:
- Explanation
- Grammar Rules
- 5 Examples
- 5 Practice Questions
- Answer Key
`;

    }

    else if(mode === "reading"){

        prompt = `
Create a CEFR ${level} reading activity.

Topic:
${topic}

Include:
- Title
- Reading Passage
- Vocabulary List
- 5 Comprehension Questions
- Answer Key
`;

    }

    else if(mode === "listening"){

        prompt = `
Create a CEFR ${level} listening activity.

Topic:
${topic}

Include:
- Listening Script
- Vocabulary List
- 5 Comprehension Questions
- Answer Key

The script should sound natural when read aloud.
`;

    }

    else{

        prompt = `
You are an English tutor.

CEFR Level:
${level}

Topic:
${topic}

Student Question:
${question}
`;

    }

    document.getElementById("response").innerText =
        "Generating response...";

    try {

        const response =
            await fetch(API_URL, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: prompt
                })

            });

        const data =
            await response.json();

        document.getElementById("response").innerText =
            data.reply || data.error;

    }

    catch(error){

        document.getElementById("response").innerText =
            "Connection error. Please try again.";

    }

}

function copyResponse(){

    navigator.clipboard.writeText(
        document.getElementById("response").innerText
    );

    alert("Response copied.");

}

function clearAll(){

    document.getElementById("question").value = "";

    document.getElementById("response").innerText =
        "Ready.";

}

updateTopics();

</script>

</body>
</html>
